document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

er; justify-content: space-between; padding: 16px 20px 12px; background-color: #FFFFFF\">\n        <div style=\"display:flex;gap:2px;padding:3px;background:oklch(0.94 0.006 85);border-radius:9px\">\n          <button sc-camel-on-click=\"{{ sortScore }}\" style=\"border:0;cursor:pointer;font:inherit;font-size:13px;padding:5px 12px;border-radius:7px;background:{{ sortScoreBg }};color:oklch(0.24 0.01 85);box-shadow:{{ sortScoreShadow }}\">By score<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ sortCost }}\" style=\"border:0;cursor:pointer;font:inherit;font-size:13px;padding:5px 12px;border-radius:7px;background:{{ sortCostBg }};color:oklch(0.24 0.01 85);box-shadow:{{ sortCostShadow }}\">By cost<\u002Fbutton>\n        <\u002Fdiv>\n        <label style=\"display:flex;align-items:center;gap:8px;font-size:13px;color:oklch(0.45 0.01 85);cursor:pointer\">\n          <input type=\"checkbox\" checked=\"{{ hideFailed }}\" sc-camel-on-change=\"{{ toggleFailed }}\" style=\"accent-color:oklch(0.45 0.09 155);margin:0\">\n          Hide failing\n        <\u002Flabel>\n      <\u002Fdiv>\n      <div style=\"padding:0 20px 12px\">\n        <button sc-camel-on-click=\"{{ openAdd }}\" style=\"width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;border-radius:10px;border:1px dashed oklch(0.82 0.008 85);background:transparent;cursor:pointer;font:inherit;font-size:13px;font-weight:500;color:oklch(0.35 0.01 85)\" style-hover=\"background:oklch(0.95 0.006 85)\"><span style=\"font-size:16px;line-height:1\">+<\u002Fspan>Add a listing from a link<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"flex: 1; overflow-y: auto; padding: 0 12px 16px; display: flex; flex-direction: column; gap: 4px; background-color: #FFFFFF\">\n        <sc-for list=\"{{ rows }}\" as=\"item\" hint-placeholder-count=\"8\">\n          <div sc-camel-on-click=\"{{ item.onClick }}\" sc-camel-on-mouse-enter=\"{{ item.onEnter }}\" sc-camel-on-mouse-leave=\"{{ item.onLeave }}\" style=\"display:grid;grid-template-columns:72px minmax(0,1fr) 48px;gap:12px;align-items:center;padding:10px;border-radius:12px;cursor:pointer;background:{{ item.rowBg }};box-shadow:{{ item.rowShadow }};transition:background .15s\">\n            <div style=\"position:relative;width:72px;height:72px;border-radius:9px;overflow:hidden;background:oklch(0.93 0.005 85)\">\n              <sc-if value=\"{{ item.hasPhoto }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"width:100%;height:100%;background-image:{{ item.photoBg }};background-size:cover;background-position:center\"><\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ item.noPhoto }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"width:100%;height:100%;background:repeating-linear-gradient(135deg,oklch(0.93 0.005 85) 0 6px,oklch(0.95 0.005 85) 6px 12px);display:flex;align-items:center;justify-content:center;font-family:ui-monospace,monospace;font-size:10px;color:oklch(0.55 0.01 85)\">no photo<\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"position:absolute;top:5px;left:5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:rgba(255,255,255,.92);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;color:oklch(0.3 0.01 85)\">{{ item.rank }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"min-width:0;display:flex;flex-direction:column;gap:3px\">\n              <div style=\"font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ item.title }}<\u002Fdiv>\n              <div style=\"display:flex;gap:6px;font-size:12px;color:oklch(0.52 0.01 85);white-space:nowrap;overflow:hidden\">\n                <span>·<\u002Fspan><span style=\"overflow:hidden;text-overflow:ellipsis\">{{ item.hood }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:12px;color:{{ item.gateInk }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ item.gateLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"height: 48px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: Inter; font-size: 26px; background: {{ item.bg }}; color: {{ item.ink }}\">{{ item.score }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Faside>\n    <main style=\"position:relative;min-height:0;background:oklch(0.95 0.005 85)\">\n      <div ref=\"{{ mapRef }}\" style=\"position:absolute;inset:0;z-index:0\"><\u002Fdiv>\n      <div style=\"position:absolute;left:16px;bottom:28px;z-index:500;background:oklch(0.99 0.003 85);border-radius:10px;padding:10px 12px;box-shadow:0 1px 2px rgba(40,30,10,.08),0 4px 16px rgba(40,30,10,.08);display:flex;flex-direction:column;gap:6px;font-size:12px;color:oklch(0.4 0.01 85)\">\n        <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:10px;height:10px;border-radius:50%;background:oklch(0.56 0.11 155)\"><\u002Fspan>80+<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:10px;height:10px;border-radius:50%;background:oklch(0.80 0.13 85)\"><\u002Fspan>60–79<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:10px;height:10px;border-radius:50%;background:oklch(0.60 0.15 28)\"><\u002Fspan>Under 60<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:10px;height:10px;border-radius:50%;background:oklch(0.72 0.005 85)\"><\u002Fspan>Fails a must-have<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showAdd }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute;inset:0;z-index:1100;background:rgba(30,25,15,.28);display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto\">\n          <div style=\"width:min(560px,100%);background:oklch(0.99 0.003 85);border-radius:18px;box-shadow:0 12px 40px rgba(40,30,10,.2);display:flex;flex-direction:column\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid oklch(0.92 0.006 85)\">\n              <div style=\"font-size:18px;font-weight:600\">Add a listing<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ closeAdd }}\" style=\"width:30px;height:30px;border-radius:50%;border:0;background:oklch(0.95 0.005 85);cursor:pointer;font:inherit;font-size:15px;color:oklch(0.4 0.01 85)\">✕<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:14px;padding:14px 24px;background:oklch(0.97 0.005 85);border-bottom:1px solid oklch(0.92 0.006 85)\">\n              <div style=\"width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Instrument Serif',serif;font-size:30px;background:{{ pvBg }};color:{{ pvInk }}\">{{ pvScore }}<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:3px\">\n                <div style=\"font-size:13px;font-weight:600;color:oklch(0.3 0.01 85)\">{{ pvStatus }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:oklch(0.5 0.01 85)\">{{ pvTotal }} · score updates as you type<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:20px 24px;display:flex;flex-direction:column;gap:16px\">\n              <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:oklch(0.5 0.01 85)\">{{ fUrl.label }}\n                <input value=\"{{ fUrl.value }}\" sc-camel-on-change=\"{{ fUrl.onChange }}\" placeholder=\"{{ fUrl.placeholder }}\" style=\"font:inherit;font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid oklch(0.88 0.006 85);background:#fff;color:oklch(0.24 0.01 85);outline:none\">\n              <\u002Flabel>\n              <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px\">\n                <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:oklch(0.5 0.01 85)\">{{ fTitle.label }}\n                  <input value=\"{{ fTitle.value }}\" sc-camel-on-change=\"{{ fTitle.onChange }}\" placeholder=\"{{ fTitle.placeholder }}\" style=\"font:inherit;font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid oklch(0.88 0.006 85);background:#fff;color:oklch(0.24 0.01 85);outline:none;min-width:0\">\n                <\u002Flabel>\n                <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:oklch(0.5 0.01 85)\">{{ fAddress.label }}\n                  <input value=\"{{ fAddress.value }}\" sc-camel-on-change=\"{{ fAddress.onChange }}\" placeholder=\"{{ fAddress.placeholder }}\" style=\"font:inherit;font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid oklch(0.88 0.006 85);background:#fff;color:oklch(0.24 0.01 85);outline:none;min-width:0\">\n                <\u002Flabel>\n              <\u002Fdiv>\n              <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:oklch(0.5 0.01 85)\">{{ fLoc.label }}\n                <input value=\"{{ fLoc.value }}\" sc-camel-on-change=\"{{ fLoc.onChange }}\" placeholder=\"{{ fLoc.placeholder }}\" style=\"font:inherit;font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid oklch(0.88 0.006 85);background:#fff;color:oklch(0.24 0.01 85);outline:none\">\n              <\u002Flabel>\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <div style=\"font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:oklch(0.55 0.01 85)\">Rooms<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px\">\n                  <sc-for list=\"{{ roomFields }}\" as=\"r\" hint-placeholder-count=\"4\">\n                    <label style=\"display:flex;flex-direction:column;gap:5px;font-size:12px;color:oklch(0.5 0.01 85)\">{{ r.label }}\n                      <input value=\"{{ r.value }}\" sc-camel-on-change=\"{{ r.onChange }}\" placeholder=\"{{ r.placeholder }}\" inputmode=\"numeric\" style=\"font:inherit;font-size:14px;padding:9px 10px;border-radius:9px;border:1px solid oklch(0.88 0.006 85);background:#fff;color:oklch(0.24 0.01 85);outline:none;min-width:0\">\n                    <\u002Flabel>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <label style=\"display:flex;align-items:center;gap:8px;font-size:13px;color:oklch(0.35 0.01 85);cursor:pointer;padding-top:2px\">\n                  <input type=\"checkbox\" checked=\"{{ fPets }}\" sc-camel-on-change=\"{{ onPets }}\" style=\"accent-color:oklch(0.45 0.09 155);margin:0\">Pets allowed\n                <\u002Flabel>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <div style=\"font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:oklch(0.55 0.01 85)\">Monthly cost (R$)<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px\">\n                  <sc-for list=\"{{ costFields }}\" as=\"c\" hint-placeholder-count=\"4\">\n                    <label style=\"display:flex;flex-direction:column;gap:5px;font-size:12px;color:oklch(0.5 0.01 85)\">{{ c.label }}\n                      <input value=\"{{ c.value }}\" sc-camel-on-change=\"{{ c.onChange }}\" placeholder=\"{{ c.placeholder }}\" inputmode=\"numeric\" style=\"font:inherit;font-size:14px;padding:9px 10px;border-radius:9px;border:1px solid oklch(0.88 0.006 85);background:#fff;color:oklch(0.24 0.01 85);outline:none;min-width:0\">\n                    <\u002Flabel>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n                  <div style=\"font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:oklch(0.55 0.01 85)\">Your ratings<\u002Fdiv>\n                  <div style=\"font-size:11px;color:oklch(0.6 0.01 85)\">2.5 = neutral / not checked<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ rateFields }}\" as=\"rt\" hint-placeholder-count=\"5\">\n                  <div style=\"display:grid;grid-template-columns:140px minmax(0,1fr) 32px;gap:12px;align-items:center\">\n                    <div style=\"font-size:13px;color:oklch(0.3 0.01 85)\">{{ rt.label }}<\u002Fdiv>\n                    <input type=\"range\" min=\"0\" max=\"5\" step=\"0.5\" value=\"{{ rt.value }}\" sc-camel-on-change=\"{{ rt.onChange }}\" style=\"accent-color:oklch(0.30 0.01 85);width:100%\">\n                    <div style=\"font-size:13px;font-variant-numeric:tabular-nums;font-weight:500;text-align:right\">{{ rt.shown }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 24px;border-top:1px solid oklch(0.92 0.006 85)\">\n              <div style=\"font-size:12px;color:oklch(0.55 0.01 85)\">Saved on this device<\u002Fdiv>\n              <div style=\"display:flex;gap:8px\">\n                <button sc-camel-on-click=\"{{ closeAdd }}\" style=\"padding:10px 16px;border-radius:10px;border:1px solid oklch(0.88 0.006 85);background:transparent;cursor:pointer;font:inherit;font-size:13px;color:oklch(0.35 0.01 85)\">Cancel<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ saveAdd }}\" style=\"padding:10px 18px;border-radius:10px;border:0;background:oklch(0.24 0.01 85);cursor:pointer;font:inherit;font-size:13px;font-weight:600;color:#fff\">Add to my list<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\ s.filter(l => l.pass).length, hasSel: false };\n    const l = listings.find(x => x.id === sel);\n    if (!l) return out;\n    const t = TIERS[l.tier];\n    const failedN = l.gates.filter(g => !g.ok).length;\n    const c = l.cost;\n    const costItems = [['Rent', c.rent], ['Condo fee', c.condo], ['IPTU (property tax)', c.iptu], ['Fire insurance', c.insurance], ['Service fee', c.service_fee]];\n    const typeMap = { house_in_condo: 'House in condo', house: 'House', apartment: 'Apartment' };\n    const over = c.total - 12000;\n    return {\n      ...out,\n      hasSel: true,\n      notesValue: notes[l.id] || '',\n      savedLabel: this.state.savedAt === l.id ? 'Saved on this device' : '',\n      onNotes: (e) => {\n        const v = e.target.value;\n        this.setState(s => {\n          const n = { ...s.notes, [l.id]: v };\n          try { localStorage.setItem('aptHunt.notes', JSON.stringify(n)); } catch (err) {}\n          return { notes: n, savedAt: l.id };\n        });\n      },\n      showScoring: !!this.state.showScoring,\n      scoringLabel: this.state.showScoring ? 'Hide ▴' : 'Show ▾',\n      toggleScoring: () => this.setState(s => ({ showScoring: !s.showScoring })),\n      sel: {\n        ...(() => {\n          const known = !!INSIGHTS[l.id];\n          const ins = INSIGHTS[l.id] || { park: ['Not estimated yet', null], market: ['Not estimated yet', null], pros: ['Add yours in the notes below'], cons: [], flags: [], amen: null };\n          const has = new Set(ins.amen || []);\n          const wk = (kind, w) => ({ kind, min: w[1] == null ? '–' : '~' + w[1], place: w[0], ink: w[1] == null ? 'oklch(0.6 0.01 85)' : walkInk(w[1]) });\n          return {\n            isCustom: !!l.custom,\n            removeSel: () => { const custom = (this.state.custom || []).filter(c => c.id !== l.id); this.saveCustom(custom, this.state.listings[0].id); },\n            walk: [wk('Park for the dog', ins.park), wk('Supermarket', ins.market)],\n            flags: ins.flags.map(text => ({ text })), hasFlags: ins.flags.length > 0,\n            pros: ins.pros.map(text => ({ text })), cons: ins.cons.map(text => ({ text })),\n            amenities: !known ? [{ label: 'Not checked yet', bg: 'oklch(0.95 0.004 85)', ink: 'oklch(0.55 0.01 85)', deco: 'none' }] : ALL_AMENITIES.map(label => has.has(label)\n              ? { label, bg: 'oklch(0.94 0.04 155)', ink: 'oklch(0.38 0.08 155)', deco: 'none' }\n              : { label, bg: 'oklch(0.95 0.004 85)', ink: 'oklch(0.62 0.01 85)', deco: 'line-through' })\n          };\n        })(),\n        photos: photosFor(l).slice(0, 3).map((src, i, a) => ({ src, bg: `url(\"${src}\")`, row: i === 0 ? 'span 2' : (a.length === 2 ? 'span 2' : 'auto') })),\n        hasPhotos: photosFor(l).length > 0, noPhotos: photosFor(l).length === 0,\n        score: l.score, ink: t.ink,\n        rankLabel: `#${l.rank} of ${listings.length}`,\n        statusBg: l.pass ? 'oklch(0.94 0.045 155)' : 'oklch(0.94 0.035 28)',\n        statusInk: l.pass ? 'oklch(0.36 0.08 155)' : 'oklch(0.44 0.13 28)',\n        statusText: l.pass ? '✓ Meets all must-haves' : `✕ Fails ${failedN} must-have${failedN > 1 ? 's' : ''}`,\n        statusSub: l.pass ? '' : `Score capped at ${l.cap} (would be ${Math.round(l.raw)})`,\n        title: l.title, address: l.address, url: l.url,\n        gates: l.gates.map(g => ({\n          label: g.label, val: g.val, icon: g.ok ? '✓' : '✕',\n          bg: g.ok ? 'oklch(0.96 0.03 155)' : 'oklch(0.95 0.03 28)',\n          ink: g.ok ? 'oklch(0.40 0.09 155)' : 'oklch(0.48 0.14 28)'\n        })),\n        specs: [\n          { k: 'Type', v: typeMap[l.type] || l.type },\n          { k: 'Area', v: l.area_m2 + ' m²' },\n          { k: 'Bedrooms', v: l.bedrooms + (l.suites ? ` · ${l.suites} suite${l.suites > 1 ? 's' : ''}` : '') },\n          { k: 'Parking', v: l.parking + (l.parking === 1 ? ' space' : ' spaces') },\n          { k: 'Floor', v: l.floor ? l.floor.replace('-', '–') : 'Ground (house)' },\n          { k: 'Pets', v: l.pets_allowed ? 'Allowed' : 'Not allowed' }\n        ],\n        costs: costItems.filter(([, v]) => v > 0).map(([label, v], i) => ({ label, amount: brl(v), pct: (v / c.total * 100) + '%', shade: SHADES[i] })),\n        total: brl(c.total),\n        budgetNote: over <= 0 ? `${brl(-over)} under the R$ 12.000 mark` : `${brl(over)} over R$ 12.000 · price rating reduced`,\n        crit: l.crit.map(k => ({\n          label: k.label,\n          rating: k.r.toFixed(1),\n          weight: k.w + '%',\n          pts: k.pts.toFixed(1),\n          barColor: k.ver === 'yes' ? 'oklch(0.30 0.01 85)' : 'oklch(0.62 0.01 85)',\n          segs: [0, 1, 2, 3, 4].map(i => ({ w: Math.max(0, Math.min(1, k.r - i)) * 100 + '%' })),\n          tag: k.ver === 'yes' ? 'Verified' : k.ver === 'calc' ? 'From total cost' : 'Estimated',\n          tagInk: k.ver === 'yes' ? 'oklch(0.40 0.09 155)' : 'oklch(0.52 0.01 85)',\n          tagBg: k.ver === 'yes' ? 'oklch(0.95 0.035 155)' : 'transparent',\n          tagBorder: k.ver === 'no' ? 'dashed' : 'solid',\n          tagLine: k.ver === 'yes' ? 'oklch(0.95 0.035 155)' : 'oklch(0.86 0.006 85)'\n        })),\n        raw: l.raw.toFixed(1),\n        rawLabel: l.pass ? 'Weighted total' : `Weighted total · capped at ${l.cap}`,\n        highlights: l.listing_highlights\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
